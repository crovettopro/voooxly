[project]
name = "voooxly"
version = "1.9.0"
description = "Private, on-device dictation for macOS: local Whisper STT plus mode-based AI cleanup."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "webrtcvad>=2.0.10",
    "setuptools<81",
    "pynput>=1.7.6",
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-AVFoundation>=10.0",
    "pyobjc-framework-Security>=10.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "anthropic>=0.40",
]

[project.scripts]
voooxly = "voooxly.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "pyinstaller>=6.0", "dmgbuild>=1.6"]

[tool.pytest.ini_options]
# The layout is src/, so the suite needs src on sys.path. Declaring it here
# instead of relying on the editable install: on macOS it is enough for the
# venv's .pth to carry the UF_HIDDEN flag for site.addpackage() to ignore it
# silently —no exception, no warning— and then the tests cannot even be imported.
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voooxly"]