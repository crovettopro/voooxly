# Voooxly configuration. Load it with config.load_config().
# Environment values (.env) take precedence over what is set here.

# --- STT (speech to text) — whisper.cpp ---
stt:
  # whisper.cpp uses a ggml .bin model. It is looked up automatically in
  # ~/.voooxly/models/ggml-large-v3-turbo-q5_0.bin (or -turbo / -large-v3 / -medium).
  # The quantized q5_0 (~550MB) is the recommended one: on 8GB Macs it does not page out.
  # Override with whatever path you want via env VOOOXLY_STT_MODEL_FILE.
  model: "ggml-large-v3-turbo"
  # Personal dictionary: proper names, brands and jargon that Whisper tends
  # to misspell. They are passed as the "initial prompt" and bias the
  # transcription toward these exact spellings. Add your own.
  dictionary: []
  server_port: 8080       # local whisper-server port
  threads: 4              # CPU threads for the decoder
  language: "auto"        # "auto" = system language. Forcing a language saves
                          # ~1.4s/request versus letting Whisper detect it;
                          # null = automatic detection. Set "es"/"en"/… if you
                          # dictate in a language other than your Mac's.
                          # The Translate EN→ES mode forces "en" on its own.
  sample_rate: 16000      # Whisper wants 16kHz mono
  partial_interval: 2.0   # seconds between buffer transcriptions (live overlay)
  partial_window: 5.0     # short window = fast partials that do not queue up the final
                          # (the whisper-server processes serially)
  keepalive_min: 4        # ping every N min to keep the model in RAM and avoid
                          # the 10-19s cold start after inactivity (0 = off)
  transcribe_timeout_floor: 30    # minimum /inference timeout: a short
                                  # dictation against a stuck server still has
                                  # to fail fast. The real timeout grows
                                  # with the audio duration (see stt.py) — this
                                  # is only the floor.
  transcribe_timeout_ceiling: 180 # hard ceiling for the timeout even if the
                                  # audio is very long: a hung server cannot
                                  # leave the app waiting forever. At the 300s
                                  # of audio.max_duration the formula gives
                                  # 150s, so in practice it should never fire.

# --- Audio / VAD ---
audio:
  device: null            # null = default device. Int index or name.
  vad_aggressiveness: 2   # 0-3 (webrtcvad). 2 = good balance.
  silence_to_stop: 1.2    # seconds of silence to auto-stop the recording
  max_duration: 300       # safety: stops at 5 min even if there is no silence.
                          # Do not lower to 60: it defeats the latch, which exists
                          # for long dictations, and everything after is lost.
  min_duration: 0.4       # discards presses shorter than 0.4s
  min_rms: 50             # minimum int16 RMS: below it = mic with no signal (TCC
                          # denied or muted) and it is discarded without calling Whisper
  pause_media: true       # pauses Spotify/Music while dictating and resumes on release
                          # (only if they were playing; asks for Automation the 1st time)

# --- Hotkeys (pynput key strings) ---
hotkeys:
  # Dictation button mode:
  #   "hold"   = push-to-talk: hold to speak, release to finish
  #   "toggle" = press to start, press again/go silent to finish
  toggle_mode: "hold"
  # Dictation key. In "hold" mode it must be ONE key (e.g. "cmd_r", "alt_r", "f6").
  # The menu (Settings → Dictation key) only offers the six modifiers of the
  # bottom row; any other valid key is set here by hand.
  #
  # AVOID F5: on a Mac it is the system Dictation key. When pressed, macOS
  # switches the input source and invalidates the TIS/TSM cache, and up to the
  # current version that killed the process with SIGTRAP (HIToolbox demands the
  # main thread to rebuild that list, and pynput touched it from its listener
  # thread). It no longer crashes — hotkey._warm_input_sources plus not
  # restarting the listener close it — but it is still a bad choice: macOS
  # keeps the event for its own dictation. Same for other keys with a system
  # function.
  toggle: ["cmd_r"]
  # Switch to the next mode
  cycle_mode: ["ctrl","shift","m"]
  # Cancel the dictation in progress (recording or processing): discards
  # everything, nothing is pasted. ONE key.
  cancel: ["esc"]
  # Latch (hold mode only): if the dictation is running long, press this key
  # WITHOUT releasing the dictation key and the recording is pinned — you can
  # let go. A tap of the dictation key finishes. Esc also undoes it. ONE key.
  latch: ["shift"]

# --- Output ---
output:
  auto_paste: true        # true = simulate Cmd+V in the active app; false = clipboard only
  copy_to_clipboard: true

# --- Learning from your corrections ---
# The master switch is NOT here: it is the "Learn from my corrections" toggle
# in Settings (prefs.json), on by default. These only shape the window that
# watches the field right after pasting, so a correction made in a message you
# then send is not lost. Every key also has a default in the code: your
# ~/.voooxly/config.yaml replaces this file wholesale, it is not merged.
learn:
  window_seconds: 15      # how long the just-pasted field is watched, at most
  poll_interval: 2.0      # seconds between reads (floor 0.5: 0 would busy-loop)
  stable_seconds: 3.0     # quiet time before a correction counts as finished.
                          # Nothing is ever learned from a state read only once:
                          # a half-typed word ("Voooxl") sounds just as right
                          # as the finished one and would be saved forever.
  acquire_seconds: 4.0    # grace for the paste to land: Cmd+V is delivered
                          # asynchronously and the field is still empty at first

# --- LLM refinement ---
llm:
  # Backend: "auto" | "ollama" | "claude" | "openai" | "none"
  # "auto" detects in cascade: Ollama running → ANTHROPIC_API_KEY →
  # OPENAI_API_KEY → none (paste the raw transcription, no AI). This way each
  # user plugs in whatever AI they have without touching anything.
  # Groq, Google Gemini and Grok (xAI) all speak the OpenAI protocol, so they
  # run under "openai" with their own base_url — pick them from the menu (AI
  # engine ›), which fills in the endpoint and model for you.
  # The cascade only ever picks itself on a fresh install: once you choose an
  # engine from the menu it is remembered, and there is no button to undo that
  # choice — disconnecting means picking another engine.
  backend: "auto"
  # Fast-lane: dictations of ≤N words in modes with fast_lane (Organize) are
  # pasted as-is without going through the LLM — Whisper already punctuates
  # short sentences well and 2-6s are saved. 0 = disabled.
  fast_lane_words: 9
  # Personal rules appended to the prompt of ALL modes (except
  # Verbatim). E.g.: "Never use semicolons. My company is spelled Ucademy."
  custom_rules: ""
  # Ollama
  ollama:
    host: "http://localhost:11434"
    # No factory-set model: hardcoding one presumes which one the user has
    # installed (and if it is ":cloud" it requires an Ollama subscription not
    # everyone has — that is how the broken default went unnoticed).
    # It is chosen from the AI engine → Ollama menu, which asks your own
    # server which models you have and lets you pick yours.
    model: ""
    temperature: 0.3
    timeout: 60             # if the LLM does not answer in time, the raw transcription
                            # is pasted. 60s, not 20: a 5-min dictation is 5× more text
                            # to refine, and when it expires the user experiences it as
                            # "the AI stopped working on long dictations".
  # Claude API (if ANTHROPIC_API_KEY is in env)
  claude:
    model: "claude-sonnet-5"
    max_tokens: 4000
    timeout: 60
  # OpenAI-compatible (base_url + key)
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-5.6-luna"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.3
    timeout: 60

# --- App ---
app:
  default_mode: "ordenar"
  language: null          # output language of the refiner. null = keep the
                          # spoken language (the usual). Set it only if you want
                          # the output to always be in one specific language.
  save_history: true      # saves each dictation to ~/.voooxly/history.jsonl
                          # (0600, rotates at 500 entries) — feeds Recent across
                          # sessions and "Search history…". false = memory only.
  show_overlay: true      # HUD with live transcription
  overlay_position: "bottom-right"   # "bottom-right" | "top-right" | "center"
  sounds: true            # subtle click when recording starts/stops (menu: Settings → Sounds)
  log_level: "INFO"
